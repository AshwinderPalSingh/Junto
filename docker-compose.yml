# Junto + PostgreSQL on one machine.
#   1. cp .env.example .env   and fill it in (POSTGRES_PASSWORD, SMTP_*, APP_URL, …)
#   2. docker compose up -d --build
# Put a TLS-terminating proxy (Caddy, nginx, Cloudflare) in front of port 3000.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: junto
      POSTGRES_DB: junto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junto -d junto"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://junto:${POSTGRES_PASSWORD}@db:5432/junto
    ports:
      - "3000:3000"

volumes:
  pgdata:
